<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artificial Analysis Intelligence Index · Video</title><style>*{box-sizing:border-box}html,body{margin:0;background:transparent}#scene{color:#171717}svg{display:block;width:100%;height:auto;aspect-ratio:16/9;background:white}svg text{font-family:Calibri,'Segoe UI',sans-serif}</style><div id="scene"><svg id="svg" viewBox="0 0 1920 1080" role="img" aria-label="Artificial Analysis historical leaderboard"><text id="title" x="44" y="74" style="font-family:Georgia,serif;font-size:46px"></text><text id="date" x="1874" y="74" text-anchor="end" font-size="38"></text><text id="version" x="44" y="124" font-size="26" fill="#666"></text><text id="change" x="1874" y="124" text-anchor="end" font-size="22" fill="#7952b5"></text><g id="plot"></g><line x1="44" y1="986" x2="1874" y2="986" stroke="#ddd"/><text id="source" x="44" y="1024" font-size="21" fill="#777">Source: Artificial Analysis · Internet Archive</text><text x="1874" y="1024" text-anchor="end" font-size="19" fill="#888">Scores aren’t comparable across benchmark versions.</text></svg></div><script>
const frames=__FRAMES_JSON__,logos=__LOGOS_JSON__,NS='http://www.w3.org/2000/svg';const $=id=>document.getElementById(id);let index=0,timer=null,running=false;const duration=__FRAME_DURATION_MS__;const chartTitle=__TITLE_JSON__,chartSource=__SOURCE_JSON__;
function el(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
const measure=document.createElement('canvas').getContext('2d');measure.font='24px Calibri, "Segoe UI", sans-serif';
function wrap(label,name,step){
 const width=text=>measure.measureText(text).width,words=name.split(/\s+/);let lines=[name];
 if(width(name)>190&&words.length>1){let best=Infinity;for(let i=1;i<words.length;i++){const pair=[words.slice(0,i).join(' '),words.slice(i).join(' ')],cost=Math.max(...pair.map(width));if(cost<best){best=cost;lines=pair}}}
 const longest=Math.max(...lines.map(width)),lane=step*Math.sin(Math.PI/3)-8;
 const size=Math.min(24,24*190/longest,lane/(lines.length===2?2.15:1.1)),lineHeight=size*1.08;
 label.setAttribute('font-size',size);label.setAttribute('data-model-label',name);
 lines.forEach((line,i)=>label.append(el('tspan',{x:0,dy:i?lineHeight:0},line)));
}

function show(i){index=Math.max(0,Math.min(frames.length-1,i));const f=frames[index],plot=$('plot');plot.replaceChildren();$('title').textContent=chartTitle;$('source').textContent=chartSource;$('date').textContent=new Date(f.date+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});$('version').textContent=(f.version.startsWith('Quality')?'Then called Quality Index':f.version)+' · Higher is better'+(f.models.some(m=>m.estimated)?' · * Estimated':'');$('change').textContent=index>0&&frames[index-1].version!==f.version?'BENCHMARK UPDATED':'';const maximum=Math.max(20,Math.ceil(Math.max(...f.models.map(m=>m.score))/10)*10),left=90,width=1770,base=710,height=540,step=width/f.models.length,bw=Math.min(58,step*.73);
for(let i=0;i<=4;i++){const y=base-i/4*height;plot.append(el('line',{x1:left,y1:y,x2:left+width,y2:y,stroke:'#c8c8c8','stroke-dasharray':'4 8'}),el('text',{x:45,y:y+6,'text-anchor':'end',fill:'#999','font-size':17},Math.round(maximum*i/4)))}
f.models.forEach((m,i)=>{const x=left+i*step+(step-bw)/2,h=m.score/maximum*height,y=base-h;const group=el('g');group.append(el('title',{},m.name+' | '+m.score),el('rect',{x,y,width:bw,height:h,rx:7,fill:m.color||'#666'}),el('text',{x:x+bw/2,y:y+h/2+8,'text-anchor':'middle',fill:h<35?'#111':'white','font-size':29},Math.round(m.score)+(m.estimated?'*':'')));if(m.logo>=0)group.append(el('image',{x:x+bw/2-17,y:base+18,width:34,height:34,href:logos[m.logo]}));else group.append(el('text',{x:x+bw/2,y:base+46,'text-anchor':'middle','font-size':17},(m.lab||'').slice(0,3)));const label=el('text',{'font-size':24,'text-anchor':'end',transform:'translate('+(x+bw/2+8)+','+(base+76)+') rotate(-60)'});wrap(label,m.name,step);group.append(label);plot.append(group)})}
function pause(){clearTimeout(timer);timer=null;running=false}function play(){pause();running=true;function next(){timer=setTimeout(()=>{if(index>=frames.length-1){pause();return}show(index+1);next()},duration)}next()}function restart(){pause();show(0);play()}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();running?pause():play()}else if(e.key==='ArrowRight'){pause();show(index+1)}else if(e.key==='ArrowLeft'){pause();show(index-1)}else if(e.key==='Home'||e.key.toLowerCase()==='r'){restart()}});
window.historyAnimation={show,play,pause,restart,frameCount:frames.length,frameDurationMs:duration,get index(){return index}};show(0);if(new URLSearchParams(location.search).get('autoplay')==='1')play();console.log('Video scene ready:',frames.length,'frames; 1920×1080; instant cuts');
</script></html>
